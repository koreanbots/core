name: Publish
on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  NAME: koreanbots/core

jobs:
  image-push:
    name: Push docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v2 
        with:
          submodules: true
      - name: Parse image tag
        run: |
          parsed=${GITHUB_REF#refs/*/}
          echo "RELEASE_TAG=${parsed//\//-}" >> $GITHUB_ENV
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: yarn
      - name: Build application
        run: |
          yarn install --frozen-lockfile
          printf 'NEXT_PUBLIC_TESTER_KEY=9f9c4a7ae9afeb045fe818ed8b741c70b1d25ec236b189566a0db020c5596441\nNEXT_PUBLIC_COMMIT_HASH=%s\nNEXT_PUBLIC_BRANCH=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > .env.local
          yarn build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_HCAPTCHA_SITEKEY: ${{ secrets.NEXT_PUBLIC_HCAPTCHA_SITEKEY }}
          NEXT_PUBLIC_SOURCE_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_TAG: ${{ env.RELEASE_TAG }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get metadata for Docker
        uses: docker/metadata-action@v4
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAME }}
          tags: |
            type=raw,value=latest,priority=100
            type=sha,prefix=,suffix=,format=short,priority=300
            type=schedule,pattern={{date 'YYYYMMDD-hhmmss' tz='Asia/Seoul'}}
      - name: Build and push
        uses: docker/build-push-action@v4
        with: 
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max